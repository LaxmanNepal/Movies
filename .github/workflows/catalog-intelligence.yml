name: Generate catalog intelligence dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-report:
    name: Build catalog review dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate dashboard and JSON report
        run: node scripts/catalog-intelligence.mjs ./report
      - name: Upload report files
        uses: actions/upload-artifact@v4
        with:
          name: moviehub-catalog-intelligence
          path: |
            report/catalog-intelligence.html
            report/catalog-intelligence.json
          if-no-files-found: error
          retention-days: 14
