name: Generate metadata review report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-review:
    name: Build review-only metadata suggestions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate review report
        run: node scripts/suggest-catalog-metadata.mjs catalog-metadata-review.json
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-metadata-review
          path: catalog-metadata-review.json
          if-no-files-found: error
          retention-days: 14
